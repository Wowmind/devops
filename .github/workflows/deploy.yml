name: CI / CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r app/requirements.txt pytest
      - run: pytest app/ -v --tb=short

  build:
    name: Build & Push to ECR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag from commit SHA
        id: meta
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build, tag, push
        env:
          REGISTRY:  ${{ steps.ecr_login.outputs.registry }}
          REPO:      devops-challenge-prod
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -t $REGISTRY/$REPO:$IMAGE_TAG -t $REGISTRY/$REPO:latest ./app
          docker push $REGISTRY/$REPO:$IMAGE_TAG
          docker push $REGISTRY/$REPO:latest

  infrastructure:
    name: Terraform Apply
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        working-directory: root
        run: terraform init

      - name: Terraform Validate
        working-directory: root
        run: terraform validate

      - name: Terraform Plan
        working-directory: root
        run: terraform plan -var="image_tag=${{ needs.build.outputs.image_tag }}" -out=tfplan

      - name: Terraform Apply
        working-directory: root
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Deploy to ECS
    needs: [build, infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster  devops-challenge-prod-cluster \
            --service  devops-challenge-prod-service \
            --force-new-deployment \
            --output   text

      - name: Wait for stability
        run: |
          aws ecs wait services-stable \
            --cluster  devops-challenge-prod-cluster \
            --services devops-challenge-prod-service

      - name: Print live URL
        run: |
          TASK=$(aws ecs list-tasks --cluster devops-challenge-prod-cluster --service-name devops-challenge-prod-service --query "taskArns[0]" --output text)
          ENI=$(aws ecs describe-tasks --cluster devops-challenge-prod-cluster --tasks $TASK --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI --query "NetworkInterfaces[0].Association.PublicIp" --output text)
          echo "App live → http://$IP:8080"
          echo "Health   → http://$IP:8080/health"
